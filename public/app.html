<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slop Academy</title>
  <meta name="description" content="Talk through code you shipped with an interviewer who has read it">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/talk.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/" aria-label="Slop Academy home">
      <span class="graded">Slop<svg viewBox="0 0 60 36" preserveAspectRatio="none" aria-hidden="true"><path class="ink" pathLength="1" d="M48 6C38 0 12 1 5 10c-7 10 4 21 24 21 18 0 29-7 27-15-1-5-7-9-16-10"/></svg></span>
      Academy
    </a>
    <div class="top-right">
      <span class="speech-chip" id="speech-chip" hidden></span>
      <div class="hud" id="hud" hidden></div>
      <span class="repo-chip" id="repo-chip" hidden></span>
      <button class="icon-btn" id="sound" type="button" aria-pressed="true" aria-label="Sound effects on" title="Sound effects">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="on" d="M9 18V5l11-2v13"/><circle class="on" cx="6" cy="18" r="3"/><circle class="on" cx="17" cy="16" r="3"/><path class="off" d="M9 18V5l11-2v13M3 3l18 18"/><circle class="off" cx="6" cy="18" r="3"/></svg>
      </button>
      <button class="icon-btn" id="voice" type="button" aria-pressed="true" aria-label="Interviewer voice on">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="mute" d="m16 9 6 6m0-6-6 6"/></svg>
      </button>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
  <script type="module" src="/talk.js"></script>
</body>
</html>
